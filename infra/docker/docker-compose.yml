# =============================================================================
# docker-compose.yml — devops-ai-platform
#
# Orquestra os dois servicos da plataforma localmente:
#   - api-gateway  : servico HTTP (Node.js/Express), expoe GET /health
#   - worker-service: processo de background Python com loop de heartbeat
#
# COMO EXECUTAR (sempre a partir da raiz do repositorio):
#
#   docker compose -f infra/docker/docker-compose.yml up --build
#
# PRE-REQUISITOS:
#   1. Crie o arquivo .env na raiz:  cp .env.example .env
#   2. Ajuste API_PORT se a porta 3000 ja estiver em uso no seu ambiente.
#
# NOTAS:
#   - Este arquivo usa Compose V2 (sem campo 'version:' obsoleto).
#   - env_file aponta para ../../.env (relativo a este arquivo, em infra/docker/).
#   - Para criar o .env local de referencia: cp infra/docker/.env.example infra/docker/.env
#     (alternativa: use apenas o .env da raiz conforme instrucoes acima).
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # api-gateway
  # Servico HTTP que expoe GET /health → HTTP 200 {"status":"ok",...}
  # Porta configuravel via API_PORT (padrao: 3000).
  # ---------------------------------------------------------------------------
  api-gateway:
    container_name: api-gateway
    build:
      context: ../../apps/api-gateway
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    env_file:
      - ../../.env
    environment:
      # Garante que a variavel API_PORT chegue ao container mesmo que o .env
      # da raiz nao esteja presente. O valor aqui e sobrescrito pelo env_file.
      API_PORT: "${API_PORT:-3000}"
    restart: unless-stopped
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${API_PORT:-3000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # worker-service
  # Processo de background Python — emite uma linha de heartbeat a cada
  # HEARTBEAT_INTERVAL segundos (padrao: 10). Sem porta exposta.
  # ---------------------------------------------------------------------------
  worker-service:
    container_name: worker-service
    build:
      context: ../../apps/worker-service
      dockerfile: Dockerfile
    env_file:
      - ../../.env
    restart: unless-stopped
    networks:
      - platform-net
    # Sem portas expostas — worker-service e um processo de background puro.

# =============================================================================
# Rede interna Docker
# Ambos os servicos estao na mesma rede para permitir comunicacao direta
# (ex: worker-service → api-gateway) sem expor portas adicionais ao host.
# =============================================================================
networks:
  platform-net:
    driver: bridge
